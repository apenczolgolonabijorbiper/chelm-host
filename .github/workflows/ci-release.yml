name: Validate and release
on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['harness-compatibility.json', 'provider-compatibility.json', 'compatibility.json', 'VERSION', 'bin/**', 'lib/**', 'schemas/**', 'integration/**', 'tests/**', 'tools/**', '.github/workflows/**', 'package.json', 'package-lock.json', 'prompts/**', 'docs/**']
  pull_request:
    paths: ['harness-compatibility.json', 'provider-compatibility.json', 'compatibility.json', 'VERSION', 'bin/**', 'lib/**', 'schemas/**', 'integration/**', 'tests/**', 'tools/**', '.github/workflows/**', 'package.json', 'package-lock.json', 'prompts/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chelm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    uses: ./.github/workflows/build-package.yml
    with:
      os: ubuntu-latest
      node: '24'
      publish-package: true
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/build-package.yml
    with:
      os: ${{ matrix.os }}
      node: '22.12.0'
  windows:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: chelm-release
          path: dist
      - name: Verify published Harness
        run: python tools/prepare-harness.py --destination ../harness-release
      - name: Verify packaged Chelm on Windows
        shell: powershell
        run: |
          $archive = (Get-ChildItem dist/chelm-host-*.zip | Select-Object -First 1).FullName
          $testProfile = if ('${{ matrix.node }}' -eq '24') { 'focused' } else { 'smoke' }
          python tools/qualify-windows-reliability.py --package $archive --harness ../harness-release --output dist/windows --profile $testProfile
      - name: Verify default full IIS application pool identity
        if: matrix.node == '24'
        shell: powershell
        run: |
          $archive = (Get-ChildItem dist/chelm-host-*.zip | Select-Object -First 1).FullName
          ./tools/Test-IisIdentity.ps1 -HostZip $archive -HarnessRoot ../harness-release -Output dist/windows/iis-identity.json -InstallPrerequisites
      - name: Verify provider mode under full IIS and IIS Express
        if: matrix.node == '24'
        shell: powershell
        run: |
          $archive = (Get-ChildItem dist/chelm-host-*.zip | Select-Object -First 1).FullName
          ./tools/Test-IisIdentity.ps1 -HostZip $archive -HarnessRoot ../harness-release -MemoryProvider -Output dist/windows/iis-provider.json
          ./tools/Test-IisIdentity.ps1 -HostZip $archive -HarnessRoot ../harness-release -MemoryProvider -Mode IisExpress -Output dist/windows/iis-express-provider.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: chelm-evidence-windows-2022-${{ matrix.node }}
          path: dist/windows/
          if-no-files-found: warn
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [package, validate, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: chelm-release
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: chelm-evidence-*
          path: evidence
      - name: Collect platform evidence
        run: |
          for folder in evidence/*; do
            for report in "$folder"/*.json; do
              [[ -f "$report" ]] || continue
              cp "$report" "dist/$(basename "$folder")-$(basename "$report")"
            done
          done
      - name: Publish versioned ZIP and checksum once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag and VERSION disagree" >&2
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; existing assets remain immutable."
          else
            node -e "const p=require('./provider-compatibility.json');if(!p.production_enabled)throw Error('Provider package is unpublished: publish Harness first, pin its release hashes and complete paired acceptance before releasing Chelm')"
            gh release create "v$version" --target "$GITHUB_SHA" --title "Chelm-host $version" --notes-file docs/RELEASE_NOTES.md dist/*.zip dist/*.sha256 dist/*.json
          fi
