name: Validate and release
on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['VERSION', 'bin/**', 'lib/**', 'schemas/**', 'integration/**', 'tests/**', 'tools/**', '.github/workflows/**', 'package.json', 'package-lock.json', 'prompts/**', 'docs/**']
  pull_request:
    paths: ['VERSION', 'bin/**', 'lib/**', 'schemas/**', 'integration/**', 'tests/**', 'tools/**', '.github/workflows/**', 'package.json', 'package-lock.json', 'prompts/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chelm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
          - os: windows-2022
            node: '22.12.0'
          - os: macos-latest
            node: '22.12.0'
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: host
      - uses: actions/checkout@v7.0.1
        with:
          repository: apenczolgolonabijorbiper/golem14-harness
          ref: v0.10.0
          path: harness-src
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts
      - name: Materialize pinned harness distribution
        run: python tools/prepare-harness.py --source ../harness-src --destination ../harness-release
      - name: Build with all Chelm and harness backend conformance tests
        run: python tools/build-release.py --harness ../harness-release
      - name: Measure synthetic host capacity and tree bounds
        run: node tools/benchmark-capacity.mjs --harness ../harness-release --output dist/capacity-${{ runner.os }}.json
      - name: Verify default full IIS application pool identity
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archive = (Get-ChildItem dist/chelm-host-*.zip | Select-Object -First 1).FullName
          ./tools/Test-IisIdentity.ps1 -HostZip $archive -HarnessRoot ../harness-release -Output dist/iis-identity.json -InstallPrerequisites
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: chelm-evidence-${{ matrix.os }}-${{ matrix.node }}
          path: host/dist/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: chelm-release
          path: host/dist/*
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: chelm-release
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: chelm-evidence-*
          path: evidence
      - name: Collect platform evidence
        run: |
          for folder in evidence/*; do
            for report in "$folder"/*.json; do
              [[ -f "$report" ]] || continue
              cp "$report" "dist/$(basename "$folder")-$(basename "$report")"
            done
          done
      - name: Publish versioned ZIP and checksum once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag and VERSION disagree" >&2
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; existing assets remain immutable."
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "Chelm-host $version" --notes-file docs/RELEASE_NOTES.md dist/*.zip dist/*.sha256 dist/*.json
          fi
